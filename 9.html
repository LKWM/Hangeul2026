<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprendre le Hangeul - Leçon 9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Poppins:wght@400;600&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --bg-color: #F8FAFC;
            --nav-height: 70px;
        }

        body {
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            height: 100dvh; /* 모바일 브라우저 하단바 정확히 계산 */
            display: flex;
            flex-direction: column;
            color: #1E293B;
        }

        .app-container {
            flex: 1; /* 네비게이션 바를 제외한 모든 높이 차지 */
            min-height: 0; /* Flex 자식 요소가 축소될 수 있도록 필수 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 5vw;
            box-sizing: border-box;
            overflow: hidden; /* 컨테이너 자체는 스크롤 불가 */
            width: 100%;
        }

        .content-box {
            width: 100%;
            max-width: 1200px;
            max-height: 100%;
            min-height: 0;
            margin: auto;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .content-box.active {
            opacity: 1;
            transform: translateY(0);
        }

        .title-main {
            font-size: clamp(1.5rem, 5vh, 3.5rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5vh;
            flex-shrink: 0;
        }

        .subtitle-main {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 1vh;
            flex-shrink: 0;
        }

        /* 텍스트 컨테이너 핵심 속성 (높이 제한 및 축소) */
        .desc-text {
            font-size: clamp(1.1rem, 2.5vh, 1.7rem);
            line-height: 1.5;
            max-width: 800px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            flex-shrink: 1; /* 공간이 부족하면 높이를 줄임 */
            min-height: 0; 
            overflow-y: auto; /* 줄어들다 넘치면 내부 스크롤 생성 */
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* 아름다운 스크롤바 디자인 */
        .desc-text::-webkit-scrollbar {
            width: 6px;
        }
        .desc-text::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }

        .char-card {
            background: white;
            border-radius: clamp(1rem, 3vh, 2rem);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: clamp(1.5rem, 4vh, 3rem);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: clamp(200px, 30vw, 320px);
            max-height: 55vh;
            border: 2px solid #F1F5F9;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0; /* 카드는 줄어들지 않음 */
        }

        .hangeul-large {
            font-size: clamp(4rem, 15vh, 9rem);
            font-weight: 700;
            line-height: 1;
            transition: color 0.5s ease;
        }

        .ipa-text {
            color: #818CF8;
            font-weight: 600;
            font-size: clamp(0.9rem, 2vh, 1.2rem);
            margin-top: 0.5rem;
            text-transform: none !important;
        }

        .illustration-img {
            max-height: clamp(120px, 30vh, 350px);
            width: auto;
            object-fit: contain;
            border-radius: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }

        .nav-bar {
            width: 100%;
            height: var(--nav-height);
            flex-shrink: 0; /* 화면 아래 공간을 70px 정확히 고정으로 차지 */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            z-index: 100;
            box-sizing: border-box;
        }

        .btn-nav {
            padding: 0.6rem clamp(1rem, 2vw, 1.5rem);
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.875rem, 2vh, 1rem);
        }

        .btn-nav:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { color: #64748B; border: 1px solid #CBD5E1; }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1.5vh;
            width: 100%;
            max-width: 700px;
            margin-top: 2vh;
            flex-shrink: 0;
        }

        .quiz-option {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 1rem;
            padding: clamp(0.8rem, 2vh, 1.5rem);
            font-size: clamp(1.2rem, 3.5vh, 2rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-option.correct { border-color: #10B981; background: #ECFDF5; color: #059669; }
        .quiz-option.wrong { border-color: #EF4444; background: #FEF2F2; color: #DC2626; }

        .mic-btn {
            width: clamp(60px, 10vh, 90px);
            height: clamp(60px, 10vh, 90px);
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 4vh, 2.5rem);
            margin: 2vh auto;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .mic-btn.recording {
            background: #EF4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status-large {
            font-size: clamp(1.2rem, 3.5vh, 1.8rem);
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .nav-bar { padding: 0 1rem; }
            .btn-nav span { display: none; }
            .quiz-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <main class="app-container">
        <div id="lesson-content" class="content-box"></div>
    </main>

    <nav class="nav-bar">
        <button id="prev-btn" class="btn-nav btn-secondary" onclick="movePage(-1)">
            <i class="ph ph-caret-left"></i> <span>Précédent</span>
        </button>
        <div id="progress" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Leçon 9</div>
        <button id="next-btn" class="btn-nav btn-primary" onclick="movePage(1)">
            <span>Suivant</span> <i class="ph ph-caret-right"></i>
        </button>
    </nav>

    <script>
        const SOUNDS = {
            ㄱ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1773374704/%E3%84%B1_lfpawz.mp3',
            ㅋ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366192/%E3%85%8B_zodx7h.mp3',
            ㄷ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1773374704/%E3%84%B7_mir7ph.mp3',
            ㅌ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366239/%E3%85%8C_pom4nf.mp3',
            ㅂ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1773374714/%E3%85%82_q88evl.mp3',
            ㅍ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366208/%E3%85%8D_cne9x4.mp3',
            ㅈ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1773374710/%E3%85%88_mo8039.mp3',
            ㅊ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366182/%E3%85%8A_gtfgv4.mp3',
            ㅎ: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366223/%E3%85%8E_k8jjuj.mp3',
            
            코: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366198/%E1%84%8F%E1%85%A9_r1nony.mp3',
            토마토: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366203/%E1%84%90%E1%85%A9%E1%84%86%E1%85%A1%E1%84%90%E1%85%A9_lgm0o7.wav',
            포도: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366218/%E1%84%91%E1%85%A9%E1%84%83%E1%85%A9_oak28e.mp3',
            치타: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366187/%E1%84%8E%E1%85%B5%E1%84%90%E1%85%A1_pjut2x.mp3',
            하다: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366228/%E1%84%92%E1%85%A1%E1%84%83%E1%85%A1_kra0uo.mp3',
            
            파다_퀴즈: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366213/%E1%84%91%E1%85%A1%E1%84%83%E1%85%A1_weczop.mp3',
            다리_퀴즈: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366245/%E1%84%83%E1%85%A1%E1%84%85%E1%85%B5_z9usgc.mp3',
            하마_퀴즈: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366234/%E1%84%92%E1%85%A1%E1%84%86%E1%85%A1_hssvj0.mp3',
            기차_퀴즈: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366177/%E1%84%80%E1%85%B5%E1%84%8E%E1%85%A1_zaiuq7.mp3'
        };

        const pages = [
            { type: 'cover', subtitle: 'Chapitre 4 - Les consonnes aspirées et tendues', title: 'Leçon 9 - ㅋ,ㅌ,ㅍ,ㅊ,ㅎ', btnText: 'Commencer', isCompleted: true },
            { type: 'text', text: "Bonjour ! Bienvenue dans le Chapitre 4. Dans ce chapitre, nous allons apprendre plusieurs variations des consonnes basiques apprises dans le Chapitre 1. Comme la forme et le son de ces lettres dérivent tous des consonnes basiques, si vous vous souvenez bien de ces dernières, vous pourrez apprendre les nouveaux sons et les nouvelles lettres beaucoup plus facilement.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366135/9-1_pbvsx7.wav', isCompleted: true },
            { type: 'text', text: "Parmi celles-ci, les lettres que nous allons apprendre aujourd'hui sont les consonnes aspirées. Attention, en phonétique, l'aspiration ne signifie pas inspirer de l'air, mais plutôt une bouffée d'air après l'émission du son. Ces sons s'écrivent avec un petit « h » dans l'alphabet phonétique.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366138/9-2_bfyjwl.wav', isCompleted: true },
            { type: 'double-char', char1: 'ㄱ', subtitle1: '/g/', charAudio1: SOUNDS.ㄱ, char2: 'ㅋ', subtitle2: '[kʰ]', charAudio2: SOUNDS.ㅋ, text: "Cette lettre s'appelle « 키읔 » et c'est la consonne aspirée du « 기역 ». Tout comme pour le /g/, la racine de la langue bloque l'air, puis le son est produit lorsque l'air s'échappe brusquement. Faites bien la distinction entre le son /k/ simple du français et le son [kʰ] aspiré du coréen.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366143/9-3_ug0xnc.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '코', ipa: '/kʰo/', subtitle: 'Nez', audio: SOUNDS.코, isCompleted: false },
            { type: 'double-char', char1: 'ㄷ', subtitle1: '/d/', charAudio1: SOUNDS.ㄷ, char2: 'ㅌ', subtitle2: '[tʰ]', charAudio2: SOUNDS.ㅌ, text: "Cette lettre s'appelle « 티읕 » et c'est la consonne aspirée du « 디귿 ». Tout comme pour le « 디귿 », le bout de la langue touche les gencives, puis le son est produit lorsque l'air s'échappe brusquement. Faites bien la distinction entre le son T du français et le son [tʰ] aspiré du coréen.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366148/9-4_z48dvm.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '토마토', ipa: '/tʰo.ma.tʰo/', subtitle: 'Tomate', audio: SOUNDS.토마토, isCompleted: false },
            { type: 'double-char', char1: 'ㅂ', subtitle1: '/b/', charAudio1: SOUNDS.ㅂ, char2: 'ㅍ', subtitle2: '[pʰ]', charAudio2: SOUNDS.ㅍ, text: "Tout comme les deux sons précédents, « 피읖 » est la consonne aspirée du « 비읍 ». Le son est produit en expulsant de l'air lorsqu'on ouvre les lèvres après les avoir fermées. Faites bien la distinction entre le son /p/ simple du français et le son /pʰ/ aspiré du coréen.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366153/9-5_fhypk9.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '포도', ipa: '/pʰo.do/', subtitle: 'Raisin', audio: SOUNDS.포도, isCompleted: false },
            { type: 'double-char', char1: 'ㅈ', subtitle1: '/dʒ/', charAudio1: SOUNDS.ㅈ, char2: 'ㅊ', subtitle2: '[tʃʰ]', charAudio2: SOUNDS.ㅊ, text: "Comme on peut le voir à sa forme, « 치읓 » est la consonne aspirée du « 지읒 ». En plaçant la langue entre le palais dur et les gencives supérieures, elle est produite en empêchant d'abord l'air de passer, puis en le relâchant à travers une voie étroite, causant de la turbulence. C'est similaire au son « tch » utilisé en français pour transcrire des mots étrangers, comme dans « tchat » ou « caoutchouc ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366158/9-6_qzscxc.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '치타', ipa: '/tʃʰi.tʰa/', subtitle: 'Guépard', audio: SOUNDS.치타, isCompleted: false },
            { type: 'char-audio', char: 'ㅎ', subtitle: 'Consonne fricative glottale', text: "Ce son ne possède ni mode d'articulation ni point d'articulation. Il est plutôt produit par un état de transition de la glotte, donc cest simplement le son de l'air qu'on expire. Faites attention à ne pas le prononcer comme le son « r » simple du français, qui vient de l'arrière de la langue et de la luette.", charAudio: SOUNDS.ㅎ, audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366162/9-7_x6trzy.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '하다', ipa: '/ha.da/', subtitle: 'Faire', audio: SOUNDS.하다, isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur le mot correct.', audio: SOUNDS.파다_퀴즈, options: ['바다', '파다'], answer: '파다', isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur le mot correct.', audio: SOUNDS.다리_퀴즈, options: ['나리', '다리', '타리'], answer: '다리', isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur le mot correct.', audio: SOUNDS.하마_퀴즈, options: ['차마', '하마'], answer: '하마', isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur le mot correct.', audio: SOUNDS.기차_퀴즈, options: ['기차', '기자'], answer: '기차', isCompleted: false },
            { type: 'text-quiz', question: 'Sélectionnez le sens du mot.', targetWord: '토마토', options: ['Raisin', 'Tomate'], answer: 'Tomate', isCompleted: false },
            { type: 'outro', text: "Incroyable ! Comme vous avez bien assimilé les consonnes basiques, ce n'est pas difficile d'apprendre de nouvelles lettres, n'est-ce pas ? En plus, vous commencez maintenant à mémoriser des mots petit à petit. La prochaine leçon sera notre dernière séance sur les variations des consonnes. Alors, on se retrouve à la leçon 10 !", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774366168/9-8_dzyxj5.wav', isCompleted: true }
        ];

        let currentPage = 0;
        let currentAudio = null;
        let interactionAudio = null;
        let backgroundAudioTimeout = null;
        let transitionSynth, correctSound, completionSound, wrongSound;
        
        let mediaRecorder;
        let audioChunks = [];
        let currentStream = null;
        let speechTries = 0;
        let recordingTimer = null;
        const MAX_TRIES = 2;
        const RECORDING_LIMIT = 6000; 

        const BASE_44_ORIGIN = "https://coreeno.base44.app";
        const CLOVA_API_FUNCTION_URL = BASE_44_ORIGIN + '/api/functions/naverClovaSpeech';

        window.onload = () => {
            Tone.Destination.volume.value = -8;
            transitionSynth = new Tone.Synth().toDestination();
            correctSound = new Tone.PolySynth().toDestination();
            wrongSound = new Tone.PolySynth().toDestination();
            completionSound = new Tone.PolySynth().toDestination();
            renderPage();
            window.addEventListener('blur', stopAllAudio);
            window.addEventListener('resize', adjustTextFit);
        };

        function stopAllAudio() {
            if (backgroundAudioTimeout) {
                clearTimeout(backgroundAudioTimeout);
                backgroundAudioTimeout = null;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (interactionAudio) {
                interactionAudio.pause();
                interactionAudio.currentTime = 0;
                interactionAudio = null;
            }
        }

        function playBackgroundAudio(url, delay = 0) {
            if (backgroundAudioTimeout) clearTimeout(backgroundAudioTimeout);
            if (!url) return; 
            backgroundAudioTimeout = setTimeout(() => {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
                currentAudio = new Audio(url);
                currentAudio.play().catch(e => {});
            }, delay);
        }

        function playInteractionAudio(url) {
            if (!url) return; 
            if (backgroundAudioTimeout) {
                clearTimeout(backgroundAudioTimeout);
                backgroundAudioTimeout = null;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (interactionAudio) {
                interactionAudio.pause();
                interactionAudio.currentTime = 0;
            }
            interactionAudio = new Audio(url);
            interactionAudio.play().catch(e => {});
        }

        function movePage(step) {
            const nextIdx = currentPage + step;
            if (nextIdx >= 0 && nextIdx < pages.length) {
                stopAllAudio();
                stopMicrophone(); 
                transitionSynth.triggerAttackRelease("C4", "8n");
                currentPage = nextIdx;
                renderPage();
            }
        }

        function renderPage() {
            const page = pages[currentPage];
            const container = document.getElementById('lesson-content');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');
            const progress = document.getElementById('progress');

            speechTries = 0; 
            container.classList.remove('active');
            
            setTimeout(() => {
                container.innerHTML = '';
                let html = '';

                nextBtn.disabled = (currentPage === pages.length - 1) || !page.isCompleted;
                prevBtn.disabled = (currentPage === 0 || currentPage === pages.length - 1);
                
                progress.innerText = `Page ${currentPage + 1} / ${pages.length}`;

                switch (page.type) {
                    case 'cover':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><h2 class="subtitle-main">${page.subtitle}</h2><h1 class="title-main">${page.title}</h1><button onclick="movePage(1)" class="mt-4 px-10 py-3 bg-indigo-600 text-white rounded-full text-lg font-bold hover:bg-indigo-700 transition-all shadow-lg shrink-0">${page.btnText}</button></div>`;
                        nextBtn.style.display = 'none'; prevBtn.style.display = 'none'; break;

                    case 'text':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><p class="desc-text font-medium mt-6">${page.text}</p></div>`;
                        nextBtn.style.display = 'flex'; prevBtn.style.display = 'flex'; break;

                    case 'char-audio':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <div class="char-card shrink-0" ${page.charAudio ? `onclick="playInteractionAudio('${page.charAudio}')"` : 'style="cursor: default;"'}>
                                    <div class="hangeul-large text-indigo-600">${page.char}</div>
                                    <p class="text-indigo-400 font-bold uppercase tracking-widest text-xs mt-3 text-center px-4 leading-tight">${page.subtitle}</p>
                                    ${page.charAudio ? `<div class="mt-4 text-indigo-300"><i class="ph ph-speaker-high text-2xl"></i></div>` : `<div class="mt-4 text-transparent"><i class="ph ph-speaker-high text-2xl"></i></div>`}
                                </div>
                                <p class="desc-text mt-6">${page.text}</p>
                            </div>
                        `;
                        break;

                    case 'double-char':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <div class="flex flex-row justify-center gap-2 sm:gap-6 w-full max-w-3xl mb-6 px-2 sm:px-0 shrink-0">
                                    <div class="char-card flex-1 !min-w-0 px-2 py-4 sm:px-4 sm:py-6 hover:scale-105" ${page.charAudio1 ? `onclick="playInteractionAudio('${page.charAudio1}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-slate-400" style="font-size: clamp(2.5rem, 8vh, 6rem);">${page.char1}</div>
                                        <p class="text-slate-400 font-bold text-base sm:text-lg mt-3 text-center px-1 leading-tight min-h-[2.5rem] flex items-center justify-center tracking-normal normal-case">${page.subtitle1}</p>
                                        ${page.charAudio1 ? `<div class="mt-2 text-slate-300"><i class="ph ph-speaker-high text-lg sm:text-xl"></i></div>` : ''}
                                    </div>
                                    <div class="char-card flex-1 !min-w-0 px-2 py-4 sm:px-4 sm:py-6 border-indigo-200 border-2 hover:scale-105" ${page.charAudio2 ? `onclick="playInteractionAudio('${page.charAudio2}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-indigo-600" style="font-size: clamp(2.5rem, 8vh, 6rem);">${page.char2}</div>
                                        <p class="text-indigo-500 font-bold text-base sm:text-lg mt-3 text-center px-1 leading-tight min-h-[2.5rem] flex items-center justify-center tracking-normal normal-case">${page.subtitle2}</p>
                                        ${page.charAudio2 ? `<div class="mt-2 text-indigo-300"><i class="ph ph-speaker-high text-lg sm:text-xl"></i></div>` : ''}
                                    </div>
                                </div>
                                <p class="desc-text">${page.text}</p>
                            </div>
                        `;
                        break;

                    case 'quiz':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900 mb-4">${page.question}</h2>
                                <button onclick="playInteractionAudio('${page.audio}')" class="w-20 h-20 shrink-0 rounded-full bg-indigo-50 text-indigo-600 text-3xl flex items-center justify-center hover:bg-indigo-100 transition-all shadow-inner mb-6"><i class="ph ph-speaker-high"></i></button>
                                <div class="quiz-grid shrink-0">
                                    ${page.options.map(opt => {
                                        let extraClass = (page.isCompleted && opt === page.answer) ? 'correct' : '';
                                        return `<button class="quiz-option ${extraClass}" onclick="checkQuizAnswer(this, '${opt}', '${page.answer}')">${opt}</button>`;
                                    }).join('')}
                                </div>
                                <p id="quiz-feedback" class="h-8 mt-4 text-lg font-bold shrink-0">${page.isCompleted ? '<span class="text-green-500">Excellent !</span>' : ''}</p>
                            </div>
                        `;
                        break;

                    case 'text-quiz':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900 mb-4">${page.question}</h2>
                                <div class="char-card shrink-0 mb-6 py-4 px-10 shadow-sm border-slate-200">
                                    <div class="hangeul-large text-indigo-600" style="font-size: clamp(3rem, 10vh, 6rem);">${page.targetWord}</div>
                                </div>
                                <div class="quiz-grid shrink-0" style="grid-template-columns: repeat(${page.options.length}, minmax(120px, 1fr));">
                                    ${page.options.map(opt => {
                                        let extraClass = (page.isCompleted && opt === page.answer) ? 'correct' : '';
                                        return `<button class="quiz-option ${extraClass}" onclick="checkQuizAnswer(this, '${opt}', '${page.answer}')">${opt}</button>`;
                                    }).join('')}
                                </div>
                                <p id="quiz-feedback" class="h-8 mt-4 text-lg font-bold shrink-0">${page.isCompleted ? '<span class="text-green-500">Excellent !</span>' : ''}</p>
                            </div>
                        `;
                        break;

                    case 'speech':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900">${page.text}</h2>
                                <div class="char-card shrink-0 mb-4" onclick="playInteractionAudio('${page.audio}')">
                                    <div id="target-char" class="hangeul-large ${page.isCompleted ? 'text-green-500' : 'text-slate-300'}">${page.target}</div>
                                    ${page.ipa ? '<p class="ipa-text">' + page.ipa + '</p>' : ''}
                                    ${page.subtitle ? '<p class="text-sm text-slate-500 font-medium mt-1">' + page.subtitle + '</p>' : ''}
                                    <div class="mt-2 text-indigo-300"><i class="ph ph-speaker-high text-xl"></i></div>
                                </div>
                                <div id="speech-ui-container" class="flex flex-col items-center shrink-0 min-h-[140px]">
                                    ${page.isCompleted ? `
                                        <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                                        <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                                        ${page.score ? `<div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2"><i class="ph ph-target text-indigo-500 text-xl"></i><span class="text-indigo-600 font-bold">Précision : ${page.score}%</span></div>` : ''}
                                    ` : `
                                        <button id="mic-btn" class="mic-btn" onclick="toggleRecording('${page.target}')"><i class="ph ph-microphone"></i></button>
                                        <p id="speech-status" class="text-slate-500 font-medium text-sm transition-all duration-300 mt-2">Cliquez sur le micro pour parler</p>
                                        <p id="speech-tries" class="text-[10px] text-slate-400 mt-1 uppercase">Essai: 0 / 2</p>
                                    `}
                                </div>
                            </div>
                        `;
                        break;

                    case 'outro':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><div class="text-5xl shrink-0 text-indigo-500 mb-4"><i class="ph ph-sparkle"></i></div><p class="desc-text font-bold text-center">${page.text}</p></div>`;
                        nextBtn.style.display = 'none';

                        completionSound.triggerAttackRelease(["E5", "G5", "C6", "E6"], "2n");
                        playBackgroundAudio(page.audio, 1000);
                        
                        setTimeout(() => {
                            window.parent.postMessage({ type: 'lesson_complete' }, '*');
                        }, 1000);
                        break;
                }

                container.innerHTML = html;
                
                const images = container.querySelectorAll('img');
                if (images.length > 0) {
                    let loadedCount = 0;
                    const checkDone = () => {
                        loadedCount++;
                        if (loadedCount === images.length) {
                            requestAnimationFrame(() => adjustTextFit());
                            container.classList.add('active');
                        }
                    };
                    images.forEach(img => {
                        if (img.complete) checkDone();
                        else {
                            img.onload = checkDone;
                            img.onerror = checkDone;
                        }
                    });
                } else {
                    requestAnimationFrame(() => adjustTextFit());
                    container.classList.add('active');
                }

                if (page.audio && page.type !== 'quiz' && page.type !== 'text-quiz' && page.type !== 'reverse-quiz' && page.type !== 'speech' && page.type !== 'outro') {
                    playBackgroundAudio(page.audio, 500);
                }
            }, 50);
        }

        function adjustTextFit() {
            const descTexts = document.querySelectorAll('.desc-text');
            descTexts.forEach(descText => {
                descText.style.fontSize = '';
                descText.style.lineHeight = '';
                
                let size = parseFloat(window.getComputedStyle(descText).fontSize);
                let attempts = 40; 
                const minSize = 13; 
                
                while (descText.scrollHeight > descText.clientHeight + 2 && size > minSize && attempts > 0) {
                    size -= 0.5;
                    descText.style.fontSize = size + 'px';
                    descText.style.lineHeight = '1.35';
                    attempts--;
                }
            });
        }

        function checkQuizAnswer(btn, selected, correct) {
            const page = pages[currentPage];
            if (page.isCompleted) return;
            const feedback = document.getElementById('quiz-feedback');
            if (selected === correct) {
                btn.classList.add('correct');
                feedback.innerHTML = '<span class="text-green-500">Excellent !</span>';
                correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                page.isCompleted = true;
                document.getElementById('next-btn').disabled = false;
            } else {
                btn.classList.add('wrong');
                feedback.innerHTML = '<span class="text-red-500">Réessayez !</span>';
                wrongSound.triggerAttackRelease(['G3', 'F3'], '8n');
                setTimeout(() => btn.classList.remove('wrong'), 1000);
            }
        }

        async function toggleRecording(target) {
            const btn = document.getElementById('mic-btn');
            const status = document.getElementById('speech-status');
            if (!btn) return;

            if (btn.classList.contains('recording')) {
                stopRecordingManually();
            } else {
                if (speechTries >= MAX_TRIES) return;
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(currentStream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result.split(',')[1];
                            await verifySpeech(base64Audio, target);
                        };
                        stopMicrophone();
                    };
                    mediaRecorder.start();
                    btn.classList.add('recording');
                    if(status) status.innerText = "Écoute...";
                    if (recordingTimer) clearTimeout(recordingTimer);
                    recordingTimer = setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === "recording") stopRecordingManually();
                    }, RECORDING_LIMIT);
                } catch (err) { if(status) status.innerText = "Erreur micro."; }
            }
        }

        function stopRecordingManually() {
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            const btn = document.getElementById('mic-btn');
            if (btn) btn.classList.remove('recording');
            if (recordingTimer) clearTimeout(recordingTimer);
        }

        function stopMicrophone() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // 두 문자열을 비교하여 일치도(%)를 계산하는 레벤슈타인 거리 알고리즘
        function calculateSimilarity(ref, hyp) {
            if (!ref && !hyp) return 100;
            if (!ref || !hyp) return 0;
            ref = ref.trim();
            hyp = hyp.trim();
            if (ref === hyp) return 100;

            const matrix = [];
            for (let i = 0; i <= ref.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= hyp.length; j++) { matrix[0][j] = j; }

            for (let i = 1; i <= ref.length; i++) {
                for (let j = 1; j <= hyp.length; j++) {
                    if (ref.charAt(i - 1) === hyp.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, 
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                        );
                    }
                }
            }
            const distance = matrix[ref.length][hyp.length];
            const maxLength = Math.max(ref.length, hyp.length);
            return Math.max(0, Math.round(((maxLength - distance) / maxLength) * 100));
        }

        async function verifySpeech(audioBase64, referenceText) {
            const status = document.getElementById('speech-status');
            const triesDisplay = document.getElementById('speech-tries');
            const btn = document.getElementById('mic-btn');
            const charText = document.getElementById('target-char');
            const page = pages[currentPage];
            
            speechTries++;
            if(triesDisplay) triesDisplay.innerText = `Essai: ${speechTries} / ${MAX_TRIES}`;

            try {
                const response = await fetch(CLOVA_API_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audioBase64: audioBase64, languageCode: "Kor", referenceText: referenceText })
                });
                
                const result = await response.json();
                
                // 클로바가 인식한 텍스트 추출
                const recognizedText = result.text || result.recognizedText || result.value || "";
                
                // API 자체 점수가 있으면 사용하고, 없으면 정답 단어와 인식된 텍스트를 비교하여 정확도 계산
                let score = result.score || result.confidence;
                if (score === undefined || score === null) {
                    score = calculateSimilarity(referenceText, recognizedText);
                }
                
                page.score = score;

                if (speechTries === 1) {
                    if(charText) charText.className = "hangeul-large text-indigo-600";
                    playInteractionAudio(page.audio);
                    if (status) {
                        status.innerText = "Essayons encore une fois !";
                        status.className = "text-green-500 status-large transition-all duration-300 transform scale-110 mt-2";
                    }
                } else if (speechTries >= 2) {
                    correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                    page.isCompleted = true;
                    if(charText) charText.className = "hangeul-large text-green-500";
                    
                    const container = document.getElementById('speech-ui-container');
                    if(container) {
                        container.innerHTML = `
                            <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                            <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                            <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2">
                                <i class="ph ph-target text-indigo-500 text-xl"></i>
                                <span class="text-indigo-600 font-bold">Précision : ${page.score}%</span>
                            </div>
                        `;
                    }
                    document.getElementById('next-btn').disabled = false;
                }
            } catch (error) {
                // 에러 발생 시 (빈 파일 등) 0점 처리
                if (speechTries >= MAX_TRIES) {
                    page.score = 0;
                    correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                    page.isCompleted = true;
                    if(charText) charText.className = "hangeul-large text-green-500";
                    
                    const container = document.getElementById('speech-ui-container');
                    if(container) {
                        container.innerHTML = `
                            <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                            <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                            <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2">
                                <i class="ph ph-target text-indigo-500 text-xl"></i>
                                <span class="text-indigo-600 font-bold">Précision : ${page.score}%</span>
                            </div>
                        `;
                    }
                    document.getElementById('next-btn').disabled = false;
                }
            }
        }
    </script>
