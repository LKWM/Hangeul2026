        const pages = [
            { type: 'cover', subtitle: 'Chapitre 5 - Les voyelles diphtongues', title: 'Leçon 12 - ㅘ, ㅝ, ㅟ, ㅢ, ㅚ, ㅙ, ㅞ', btnText: 'Commencer', isCompleted: true },
            { type: 'text', text: "Bonjour ! Bienvenue dans la deuxième leçon du Chapitre 5. Aujourd'hui, c'est le dernier jour où nous apprenons de nouvelles lettres. En apprenant seulement sept lettres de plus, vous aurez appris toutes les lettres du hangeul !", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769344/12-1_a7kzqj.wav', isCompleted: true },
            { type: 'char-no-audio', char: 'ㅘ, ㅝ, ㅟ, ㅢ, ㅚ, ㅙ, ㅞ', text: "Les sept lettres que nous allons apprendre aujourd'hui sont créées en combinant les voyelles monophtongues que nous avons apprises dans le Chapitre 2. On les appelle aussi des voyelles combinées.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769350/12-2_ixu47t.wav', isCompleted: true },
            { type: 'combine-char', char1: 'ㅗ', subtitle1: '/o/', charAudio1: SOUNDS.ㅗ, char2: 'ㅏ', subtitle2: '/ɑ/', charAudio2: SOUNDS.ㅏ, char3: 'ㅘ', subtitle3: '/oɑ/', charAudio3: SOUNDS.ㅘ, text: "Les voyelles combinées sont toujours composées d'une voyelle horizontale et d'une voyelle verticale. À l'écrit et à l'oral, la voyelle horizontale vient en premier, suivie de la voyelle verticale. Comme cette lettre commence par le son /o/ et se termine par le son /ɑ/, elle se prononce « ㅘ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769356/12-3_p4by0v.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '사과', ipa: '/sa.gwa/', subtitle: 'Pomme', audio: SOUNDS.사과, isCompleted: false },
            { type: 'combine-char', char1: 'ㅜ', subtitle1: '/u/', charAudio1: SOUNDS.ㅜ, char2: 'ㅓ', subtitle2: '/ʌ/', charAudio2: SOUNDS.ㅓ, char3: 'ㅝ', subtitle3: '/uʌ/', charAudio3: SOUNDS.ㅝ, text: "De la même manière, cette lettre commence par /u/ et se termine par /ʌ/, et se prononce « ㅝ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769362/12-4_myspm6.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '공원', ipa: '/goŋ.wʌn/', subtitle: 'Parc', audio: SOUNDS.공원, isCompleted: false },
            { type: 'combine-char', char1: 'ㅜ', subtitle1: '/u/', charAudio1: SOUNDS.ㅜ, char2: 'ㅣ', subtitle2: '/i/', charAudio2: SOUNDS.ㅣ, char3: 'ㅟ', subtitle3: '/ui/', charAudio3: SOUNDS.ㅟ, text: "Cette fois encore, on prononce d'abord la voyelle horizontale /u/ et on termine par /i/, ce qui se prononce « ㅟ ». Les francophones confondent souvent ce son avec la lettre « u » du français, mais veillez bien à le prononcer comme une diphtongue dont le début et la fin sont différents.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769369/12-5_wu8j0m.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '가위', ipa: '/ga.wi/', subtitle: 'Ciseaux', audio: SOUNDS.가위, isCompleted: false },
            { type: 'combine-char', char1: 'ㅡ', subtitle1: '/ɯ/', charAudio1: SOUNDS.ㅡ, char2: 'ㅣ', subtitle2: '/i/', charAudio2: SOUNDS.ㅣ, char3: 'ㅢ', subtitle3: '/ɯi/', charAudio3: SOUNDS.ㅢ, text: "De la même manière, cette lettre commence par /ɯ/ et se termine par /i/, et se prononce /ㅢ/. Bien qu'il s'agisse d'une seule lettre, les sons des deux voyelles sont clairement distincts, ce qui peut donner l'impression d'entendre deux syllabes. Dans certains dialectes régionaux, on a tendance à presque ne pas prononcer le son /i/, mais en coréen standard, on distingue clairement les deux sons et on la prononce « ㅢ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769376/12-6_wxekvu.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '의사', ipa: '/ɰi.sa/', subtitle: 'Médecin', audio: SOUNDS.의사, isCompleted: false },
            { type: 'combine-char', char1: 'ㅗ', subtitle1: '/o/', charAudio1: SOUNDS.ㅗ, char2: 'ㅣ → ㅔ', subtitle2: '/i/ → /e/', charAudio2: SOUNDS.ㅔ, char3: 'ㅚ', subtitle3: '/oe/', charAudio3: SOUNDS.ㅚ, text: "Cette lettre est vraiment importante ! À l'écrit, c'est la combinaison de « ㅗ » et « ㅣ », mais à l'oral, elle se prononce comme une diphtongue qui commence par /o/ et se termine par /e/. C'est parce qu'à l'origine, cette lettre était une monophtongue comme le son /ø/, mais en coréen moderne, la plupart des locuteurs la prononcent comme une diphtongue, c'est-à-dire « ㅚ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769382/12-7_anjnva.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '교회', ipa: '/gjo.hwe/', subtitle: 'Église', audio: SOUNDS.교회, isCompleted: false },
            { type: 'combine-char', char1: 'ㅗ', subtitle1: '/o/', charAudio1: SOUNDS.ㅗ, char2: 'ㅐ', subtitle2: '/æ/', charAudio2: SOUNDS.ㅐ, char3: 'ㅙ', subtitle3: '/oæ/', charAudio3: SOUNDS.ㅙ, text: "Comme sa forme l'indique, cette lettre commence par /o/ et se termine par /æ/, et se prononce « ㅙ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769388/12-8_wken9v.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '왜', ipa: '/wɛ/', subtitle: 'Pourquoi', audio: SOUNDS.왜, isCompleted: false },
            { type: 'combine-char', char1: 'ㅜ', subtitle1: '/u/', charAudio1: SOUNDS.ㅜ, char2: 'ㅔ', subtitle2: '/e/', charAudio2: SOUNDS.ㅔ, char3: 'ㅞ', subtitle3: '/ue/', charAudio3: SOUNDS.ㅞ, text: "C'est enfin la dernière lettre ! Comme sa forme l'indique également, cette lettre commence par /u/ et se termine par /e/, et il suffit de la prononcer « ㅞ ». Ce n'est pas difficile, n'est-ce pas ?", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769395/12-9_kbmdek.wav', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '스웨터', ipa: '/sɯ.we.tʰʌ/', subtitle: 'Sweater (Pull)', audio: SOUNDS.스웨터, isCompleted: false },
            { type: 'triple-char', char1: 'ㅚ', charAudio1: SOUNDS.ㅚ, char2: 'ㅙ', charAudio2: SOUNDS.ㅙ, char3: 'ㅞ', charAudio3: SOUNDS.ㅞ, text: "Dans les leçons précédentes, nous avons expliqué la neutralisation de « ㅔ » et « ㅐ ». Comme cette caractéristique se retrouve aussi dans les diphtongues, ces trois lettres, y compris « ㅚ » dont la prononciation est la combinaison de /o/ et /e/, ont toutes un son final presque identique. Lorsqu'on parle lentement, on peut distinguer « ㅚ » et « ㅙ » qui commencent par /o/, et « ㅞ » qui commence par /u/. Cependant, dans la parole réelle, la plupart des gens ne font pas de distinction de prononciation entre « ㅚ », « ㅙ » et « ㅞ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769402/12-10_bxos2h.wav', isCompleted: true },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur la lettre correcte.', audio: SOUNDS.봐_퀴즈, options: ['봐', '뭐', '쥐', '의'], answer: '봐', isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur la lettre correcte.', audio: SOUNDS.의자_퀴즈, options: ['의자', '의사', '위기'], answer: '의자', isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur la lettre correcte.', audio: SOUNDS.귀_퀴즈, options: ['과', '궈', '귀', '긔'], answer: '귀', isCompleted: false },

            { type: 'outro', text: "Félicitations ! Vous avez maintenant appris tous les sons des consonnes et des voyelles ! À partir de maintenant, si vous le souhaitez, vous pouvez commencer en parallèle d'autres programmes de niveau A0 ou A1. Dans le Chapitre 6, nous verrons comment les consonnes apprises précédemment se prononcent en tant que consonnes finales. Il ne vous reste plus que deux leçons avant de pouvoir lire tous les mots et toutes les phrases en coréen ! Alors, à très bientôt !", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774769409/12-11_hjdh5e.wav', isCompleted: true }

        function stopAllAudio() {
            if (backgroundAudioTimeout) {

                currentAudio.pause();

                interactionAudio.pause();
                interactionAudio.currentTime = 0;
                interactionAudio = null;
            }
        }

        function playBackgroundAudio(url, delay = 0) {
            if (backgroundAudioTimeout) clearTimeout(backgroundAudioTimeout);
            if (!url) return; 
            backgroundAudioTimeout = setTimeout(() => {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
                currentAudio = new Audio(url);
                currentAudio.play().catch(e => {});
            }, delay);
        }

        function playInteractionAudio(url) {
            if (!url) return; 
            if (backgroundAudioTimeout) {
                clearTimeout(backgroundAudioTimeout);
                backgroundAudioTimeout = null;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (interactionAudio) {
                interactionAudio.pause();
                interactionAudio.currentTime = 0;
            }
            interactionAudio = new Audio(url);
            interactionAudio.play().catch(e => {});
        }

        function movePage(step) {
            const nextIdx = currentPage + step;
            if (nextIdx >= 0 && nextIdx < pages.length) {
                stopAllAudio();
                stopMicrophone(); 
                transitionSynth.triggerAttackRelease("C4", "8n");
                currentPage = nextIdx;
                renderPage();
            }
        }

        function renderPage() {
            const page = pages[currentPage];
            const container = document.getElementById('lesson-content');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');
            const progress = document.getElementById('progress');

            speechTries = 0; 
            container.classList.remove('active');
            
            setTimeout(() => {
                container.innerHTML = '';
                let html = '';

                nextBtn.disabled = (currentPage === pages.length - 1) || !page.isCompleted;
                prevBtn.disabled = (currentPage === 0 || currentPage === pages.length - 1);
                
                progress.innerText = `Page ${currentPage + 1} / ${pages.length}`;

                switch (page.type) {
                    case 'cover':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><h2 class="subtitle-main">${page.subtitle}</h2><h1 class="title-main">${page.title}</h1><button onclick="movePage(1)" class="mt-4 px-10 py-3 bg-indigo-600 text-white rounded-full text-lg font-bold hover:bg-indigo-700 transition-all shadow-lg shrink-0">${page.btnText}</button></div>`;
                        nextBtn.style.display = 'none'; prevBtn.style.display = 'none'; break;

                    case 'text':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><p class="desc-text font-medium mt-6">${page.text}</p></div>`;
                        nextBtn.style.display = 'flex'; prevBtn.style.display = 'flex'; break;

                    case 'char-no-audio':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <div class="char-card mb-6 cursor-default px-6 sm:px-12 py-8 sm:py-10 shrink-0">
                                    <div class="hangeul-large text-indigo-600 tracking-wider" style="font-size: clamp(2rem, 5vh, 4rem);">${page.char}</div>
                                </div>
                                <p class="desc-text mt-2">${page.text}</p>
                            </div>
                        `;
                        break;

                    case 'combine-char':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <div class="flex flex-row items-center justify-center gap-1 sm:gap-3 w-full max-w-4xl mb-4 sm:mb-6 px-1 sm:px-0 shrink-0">
                                    <div class="char-card flex-1 !min-w-0 px-1 py-3 sm:px-4 sm:py-6 hover:scale-105" ${page.charAudio1 ? `onclick="playInteractionAudio('${page.charAudio1}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-slate-400" style="font-size: clamp(1.8rem, 5vh, 4.5rem);">${page.char1}</div>
                                        <p class="text-slate-400 font-bold text-xs sm:text-base mt-2 sm:mt-3 text-center px-1 leading-tight min-h-[2rem] flex items-center justify-center tracking-normal normal-case">${page.subtitle1}</p>
                                        ${page.charAudio1 ? `<div class="mt-1 sm:mt-2 text-slate-300"><i class="ph ph-speaker-high text-base sm:text-lg"></i></div>` : ''}
                                    </div>
                                    <span class="text-slate-300 text-xl sm:text-3xl font-bold">+</span>
                                    <div class="char-card flex-1 !min-w-0 px-1 py-3 sm:px-4 sm:py-6 hover:scale-105" ${page.charAudio2 ? `onclick="playInteractionAudio('${page.charAudio2}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-slate-400 whitespace-nowrap tracking-tighter" style="font-size: clamp(1.5rem, 4vh, 3.5rem);">${page.char2}</div>
                                        <p class="text-slate-400 font-bold text-xs sm:text-base mt-2 sm:mt-3 text-center px-1 leading-tight min-h-[2rem] flex items-center justify-center tracking-normal normal-case">${page.subtitle2}</p>
                                        ${page.charAudio2 ? `<div class="mt-1 sm:mt-2 text-slate-300"><i class="ph ph-speaker-high text-base sm:text-lg"></i></div>` : ''}
                                    </div>
                                    <span class="text-slate-300 text-xl sm:text-3xl font-bold">=</span>
                                    <div class="char-card flex-1 !min-w-0 px-1 py-3 sm:px-4 sm:py-6 border-indigo-200 border-2 hover:scale-105" ${page.charAudio3 ? `onclick="playInteractionAudio('${page.charAudio3}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-indigo-600" style="font-size: clamp(1.8rem, 5vh, 4.5rem);">${page.char3}</div>
                                        <p class="text-indigo-500 font-bold text-xs sm:text-base mt-2 sm:mt-3 text-center px-1 leading-tight min-h-[2rem] flex items-center justify-center tracking-normal normal-case">${page.subtitle3}</p>
                                        ${page.charAudio3 ? `<div class="mt-1 sm:mt-2 text-indigo-300"><i class="ph ph-speaker-high text-base sm:text-lg"></i></div>` : ''}
                                    </div>
                                </div>
                                <p class="desc-text">${page.text}</p>
                            </div>
                        `;
                        break;

                    case 'triple-char':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <div class="flex flex-row justify-center gap-2 sm:gap-6 w-full max-w-3xl mb-6 px-2 sm:px-0 shrink-0">
                                    <div class="char-card flex-1 !min-w-0 px-2 py-4 sm:px-4 sm:py-6 hover:scale-105" ${page.charAudio1 ? `onclick="playInteractionAudio('${page.charAudio1}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-indigo-600" style="font-size: clamp(2rem, 6vh, 4.5rem);">${page.char1}</div>
                                        ${page.charAudio1 ? `<div class="mt-2 text-indigo-300"><i class="ph ph-speaker-high text-lg sm:text-xl"></i></div>` : ''}
                                    </div>
                                    <div class="char-card flex-1 !min-w-0 px-2 py-4 sm:px-4 sm:py-6 hover:scale-105" ${page.charAudio2 ? `onclick="playInteractionAudio('${page.charAudio2}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-indigo-600" style="font-size: clamp(2rem, 6vh, 4.5rem);">${page.char2}</div>
                                        ${page.charAudio2 ? `<div class="mt-2 text-indigo-300"><i class="ph ph-speaker-high text-lg sm:text-xl"></i></div>` : ''}
                                    </div>
                                    <div class="char-card flex-1 !min-w-0 px-2 py-4 sm:px-4 sm:py-6 hover:scale-105" ${page.charAudio3 ? `onclick="playInteractionAudio('${page.charAudio3}')"` : 'style="cursor: default;"'}>
                                        <div class="hangeul-large text-indigo-600" style="font-size: clamp(2rem, 6vh, 4.5rem);">${page.char3}</div>
                                        ${page.charAudio3 ? `<div class="mt-2 text-indigo-300"><i class="ph ph-speaker-high text-lg sm:text-xl"></i></div>` : ''}
                                    </div>
                                </div>
                                <p class="desc-text">${page.text}</p>
                            </div>
                        `;
                        break;

                    case 'quiz':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900 mb-4">${page.question}</h2>
                                <button onclick="playInteractionAudio('${page.audio}')" class="w-20 h-20 shrink-0 rounded-full bg-indigo-50 text-indigo-600 text-3xl flex items-center justify-center hover:bg-indigo-100 transition-all shadow-inner mb-6"><i class="ph ph-speaker-high"></i></button>
                                <div class="quiz-grid shrink-0">
                                    ${page.options.map(opt => {
                                        let extraClass = (page.isCompleted && opt === page.answer) ? 'correct' : '';
                                        return `<button class="quiz-option ${extraClass}" onclick="checkQuizAnswer(this, '${opt}', '${page.answer}')">${opt}</button>`;
                                    }).join('')}
                                </div>
                                <p id="quiz-feedback" class="h-8 mt-4 text-lg font-bold shrink-0">${page.isCompleted ? '<span class="text-green-500">Excellent !</span>' : ''}</p>
                            </div>
                        `;
                        break;

                    case 'text-quiz':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900 mb-4 text-center px-4">${page.question}</h2>
                                ${page.audio ? `<button onclick="playInteractionAudio('${page.audio}')" class="w-20 h-20 shrink-0 rounded-full bg-indigo-50 text-indigo-600 text-3xl flex items-center justify-center hover:bg-indigo-100 transition-all shadow-inner mb-6"><i class="ph ph-speaker-high"></i></button>` : ''}
                                ${page.targetWord ? `
                                <div class="char-card shrink-0 mb-6 py-4 px-10 shadow-sm border-slate-200">
                                    <div class="hangeul-large text-indigo-600" style="font-size: clamp(3rem, 10vh, 6rem);">${page.targetWord}</div>
                                </div>
                                ` : ''}
                                <div class="quiz-grid shrink-0" style="grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));">
                                    ${page.options.map(opt => {
                                        let extraClass = (page.isCompleted && opt === page.answer) ? 'correct' : '';
                                        return `<button class="quiz-option ${extraClass}" onclick="checkQuizAnswer(this, '${opt}', '${page.answer}')">${opt}</button>`;
                                    }).join('')}
                                </div>
                                <p id="quiz-feedback" class="h-8 mt-4 text-lg font-bold shrink-0">${page.isCompleted ? '<span class="text-green-500">Excellent !</span>' : ''}</p>
                            </div>
                        `;
                        break;

                    case 'speech':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900">${page.text}</h2>
                                <div class="char-card shrink-0 mb-4" onclick="playInteractionAudio('${page.audio}')">
                                    <div id="target-char" class="hangeul-large ${page.isCompleted ? 'text-green-500' : 'text-slate-300'}">${page.target}</div>
                                    ${page.ipa ? `<p class="ipa-text">${page.ipa}</p>` : ''}
                                    ${page.subtitle ? `<p class="text-sm text-slate-500 font-medium mt-1">${page.subtitle}</p>` : ''}
                                    <div class="mt-2 text-indigo-300"><i class="ph ph-speaker-high text-xl"></i></div>
                                </div>
                                <div id="speech-ui-container" class="flex flex-col items-center shrink-0 min-h-[140px]">
                                    ${page.isCompleted ? `
                                        <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                                        <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                                        ${page.score !== undefined ? `<div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2"><i class="ph ph-target text-indigo-500 text-xl"></i><span class="text-indigo-600 font-bold">Précision : ${page.score}%</span></div>` : ''}
                                    ` : `
                                        <button id="mic-btn" class="mic-btn" onclick="toggleRecording('${page.target}')"><i class="ph ph-microphone"></i></button>
                                        <p id="speech-status" class="text-slate-500 font-medium text-sm transition-all duration-300 mt-2">Cliquez sur le micro pour parler</p>
                                        <p id="speech-tries" class="text-[10px] text-slate-400 mt-1 uppercase">Essai: 0 / 2</p>
                                    `}
                                </div>
                            </div>
                        `;
                        break;

                    case 'outro':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><div class="text-5xl shrink-0 text-indigo-500 mb-4"><i class="ph ph-sparkle"></i></div><p class="desc-text font-bold text-center">${page.text}</p></div>`;
                        nextBtn.style.display = 'none';

                        completionSound.triggerAttackRelease(["E5", "G5", "C6", "E6"], "2n");
                        playBackgroundAudio(page.audio, 1000);
                        
                        setTimeout(() => {
                            window.parent.postMessage({ type: 'lesson_complete' }, '*');
                        }, 1000);
                        break;
                }

                container.innerHTML = html;
                
                requestAnimationFrame(() => adjustTextFit());
                container.classList.add('active');

                if (page.audio && page.type !== 'quiz' && page.type !== 'text-quiz' && page.type !== 'reverse-quiz' && page.type !== 'speech' && page.type !== 'outro') {
                    playBackgroundAudio(page.audio, 500);
                }
            }, 50);
        }

        function adjustTextFit() {
            const descTexts = document.querySelectorAll('.desc-text');
            descTexts.forEach(descText => {
                descText.style.fontSize = '';
                descText.style.lineHeight = '';
                
                let size = parseFloat(window.getComputedStyle(descText).fontSize);
                let attempts = 40; 
                const minSize = 13; 
                
                while (descText.scrollHeight > descText.clientHeight + 2 && size > minSize && attempts > 0) {
                    size -= 0.5;
                    descText.style.fontSize = size + 'px';
                    descText.style.lineHeight = '1.35';
                    attempts--;
                }
            });
        }

        function checkQuizAnswer(btn, selected, correct) {
            const page = pages[currentPage];
            if (page.isCompleted) return;
            const feedback = document.getElementById('quiz-feedback');
            if (selected === correct) {
                btn.classList.add('correct');
                feedback.innerHTML = '<span class="text-green-500">Excellent !</span>';
                correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                page.isCompleted = true;
                document.getElementById('next-btn').disabled = false;
            } else {
                btn.classList.add('wrong');
                feedback.innerHTML = '<span class="text-red-500">Réessayez !</span>';
                wrongSound.triggerAttackRelease(['G3', 'F3'], '8n');
                setTimeout(() => btn.classList.remove('wrong'), 1000);
            }
        }

        async function toggleRecording(target) {
            const btn = document.getElementById('mic-btn');
            const status = document.getElementById('speech-status');
            if (!btn) return;

            if (btn.classList.contains('recording')) {
                stopRecordingManually();
            } else {
                if (speechTries >= MAX_TRIES) return;
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(currentStream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result.split(',')[1];
                            await verifySpeech(base64Audio, target);
                        };
                        stopMicrophone();
                    };
                    mediaRecorder.start();
                    btn.classList.add('recording');
                    if(status) status.innerText = "Écoute...";
                    if (recordingTimer) clearTimeout(recordingTimer);
                    recordingTimer = setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === "recording") stopRecordingManually();
                    }, RECORDING_LIMIT);
                } catch (err) { if(status) status.innerText = "Erreur micro."; }
            }
        }

        function stopRecordingManually() {
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            const btn = document.getElementById('mic-btn');
            if (btn) btn.classList.remove('recording');
            if (recordingTimer) clearTimeout(recordingTimer);
        }

        function stopMicrophone() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        function calculateSimilarity(ref, hyp) {
            if (!ref && !hyp) return 100;
            if (!ref || !hyp) return 0;
            ref = ref.trim();
            hyp = hyp.trim();
            if (ref === hyp) return 100;

            const matrix = [];
            for (let i = 0; i <= ref.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= hyp.length; j++) { matrix[0][j] = j; }

            for (let i = 1; i <= ref.length; i++) {
                for (let j = 1; j <= hyp.length; j++) {
                    if (ref.charAt(i - 1) === hyp.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, 
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                        );
                    }
                }
            }
            const distance = matrix[ref.length][hyp.length];
            const maxLength = Math.max(ref.length, hyp.length);
            return Math.max(0, Math.round(((maxLength - distance) / maxLength) * 100));
        }

        async function verifySpeech(audioBase64, referenceText) {
            const status = document.getElementById('speech-status');
            const triesDisplay = document.getElementById('speech-tries');
            const btn = document.getElementById('mic-btn');
            const charText = document.getElementById('target-char');
            const page = pages[currentPage];
            
            speechTries++;
            if(triesDisplay) triesDisplay.innerText = `Essai: ${speechTries} / ${MAX_TRIES}`;

            try {
                const response = await fetch(CLOVA_API_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audioBase64: audioBase64, languageCode: "Kor", referenceText: referenceText })
                });
                
                const result = await response.json();
                
                const recognizedText = result.text || result.recognizedText || result.value || "";
                
                let score = result.score || result.confidence;
                if (score === undefined || score === null) {
                    score = calculateSimilarity(referenceText, recognizedText);
                }
                
                page.score = score;

                if (speechTries === 1) {
                    if(charText) charText.className = "hangeul-large text-indigo-600";
                    playInteractionAudio(page.audio);
                    if (status) {
                        status.innerText = "Essayons encore une fois !";
                        status.className = "text-green-500 status-large transition-all duration-300 transform scale-110 mt-2";
                    }
                } else if (speechTries >= 2) {
                    correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                    page.isCompleted = true;
                    if(charText) charText.className = "hangeul-large text-green-500";
                    
                    const container = document.getElementById('speech-ui-container');
                    if(container) {
                        container.innerHTML = `
                            <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                            <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                            <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2">
                                <i class="ph ph-target text-indigo-500 text-xl"></i>
                                <span class="text-indigo-600 font-bold">Précision : ${page.score}%</span>
                            </div>
                        `;
                    }
                    document.getElementById('next-btn').disabled = false;
                }
            } catch (error) {
                if (speechTries >= MAX_TRIES) {
                    page.score = 0;
                    correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                    page.isCompleted = true;
                    if(charText) charText.className = "hangeul-large text-green-500";
                    
                    const container = document.getElementById('speech-ui-container');
                    if(container) {
                        container.innerHTML = `
                            <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                            <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                            <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2">
                                <i class="ph ph-target text-indigo-500 text-xl"></i>
                                <span class="text-indigo-600 font-bold">Précision : ${page.score}%</span>
                            </div>
                        `;
                    }
                    document.getElementById('next-btn').disabled = false;
                }
            }
        }
    </script>
