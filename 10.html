<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Poppins:wght@400;600&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --bg-color: #F8FAFC;
            --nav-height: 70px;
        }

        body {
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            color: #1E293B;
        }

        .app-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 5vw;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
        }

        .content-box {
            width: 100%;
            max-width: 1200px;
            max-height: 100%;
            min-height: 0;
            margin: auto;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .content-box.active {
            opacity: 1;
            transform: translateY(0);
        }

        .title-main {
            font-size: clamp(1.5rem, 5vh, 3.5rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5vh;
            flex-shrink: 0;
        }

        .subtitle-main {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 1vh;
            flex-shrink: 0;
        }

        .desc-text {
            font-size: clamp(1.1rem, 2.5vh, 1.7rem);
            line-height: 1.5;
            max-width: 800px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            flex-shrink: 1;
            min-height: 0; 
            overflow-y: auto;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .desc-text::-webkit-scrollbar {
            width: 6px;
        }
        .desc-text::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }

        .char-card {
            background: white;
            border-radius: clamp(1rem, 3vh, 2rem);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: clamp(1.5rem, 4vh, 3rem);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: clamp(200px, 30vw, 320px);
            max-height: 55vh;
            border: 2px solid #F1F5F9;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .hangeul-large {
            font-size: clamp(4rem, 15vh, 9rem);
            font-weight: 700;
            line-height: 1;
            transition: color 0.5s ease;
        }

        .ipa-text {
            color: #818CF8;
            font-weight: 600;
            font-size: clamp(0.9rem, 2vh, 1.2rem);
            margin-top: 0.5rem;
            text-transform: none !important;
        }

        .nav-bar {
            width: 100%;
            height: var(--nav-height);
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            z-index: 100;
            box-sizing: border-box;
        }

        .btn-nav {
            padding: 0.6rem clamp(1rem, 2vw, 1.5rem);
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.875rem, 2vh, 1rem);
        }

        .btn-nav:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { color: #64748B; border: 1px solid #CBD5E1; }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1.5vh;
            width: 100%;
            max-width: 700px;
            margin-top: 2vh;
            flex-shrink: 0;
        }

        .quiz-option {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 1rem;
            padding: clamp(0.8rem, 2vh, 1.5rem);
            font-size: clamp(1.2rem, 3.5vh, 2rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-option.correct { border-color: #10B981; background: #ECFDF5; color: #059669; }
        .quiz-option.wrong { border-color: #EF4444; background: #FEF2F2; color: #DC2626; }

        .mic-btn {
            width: clamp(60px, 10vh, 90px);
            height: clamp(60px, 10vh, 90px);
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 4vh, 2.5rem);
            margin: 2vh auto;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .mic-btn.recording {
            background: #EF4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status-large {
            font-size: clamp(1.2rem, 3.5vh, 1.8rem);
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .nav-bar { padding: 0 1rem; }
            .btn-nav span { display: none; }
            .quiz-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

            또: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528076/%E1%84%84%E1%85%A9_s5vgqv.mp3',
            아빠: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528087/%E1%84%8B%E1%85%A1%E1%84%88%E1%85%A1_pirxdm.mp3',
            쓰다: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528081/%E1%84%8A%E1%85%B3%E1%84%83%E1%85%A1_tt38tx.mp3',
            짜다: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528427/%E1%84%8D%E1%85%A1%E1%84%83%E1%85%A1_bamdow.mp3',
            
            사다: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528385/%E1%84%89%E1%85%A1%E1%84%83%E1%85%A1_ygn3px.mp3',
            싸다: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528281/%E1%84%8A%E1%85%A1%E1%84%83%E1%85%A1_dh0mfp.mp3',
            자다: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528339/%E1%84%8C%E1%85%A1%E1%84%83%E1%85%A1_ooj2up.mp3',
            빵: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528546/%E1%84%88%E1%85%A1%E1%86%BC_zcxvga.mp3',
            방: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528540/%E1%84%87%E1%85%A1%E1%86%BC_w3eo2i.mp3',
            토_퀴즈: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774528098/%E1%84%90%E1%85%A9_iok4jh.mp3'
        };

        const pages = [
            { type: 'cover', subtitle: 'Chapitre 4 - Les consonnes aspirées et tendues', title: 'Leçon 10 - ㄲ,ㄸ,ㅃ,ㅆ,ㅉ', btnText: 'Commencer', isCompleted: true },
            { type: 'text', text: "Bonjour ! Dans cette leçon, nous allons apprendre les variations tendues des consonnes basiques. Les consonnes tendues s'expriment en écrivant la même lettre deux fois de suite. Au niveau du son, on les prononce en poussant ou en appuyant fortement sur les organes phonatoires, sans aspiration. Elles ressemblent aux consonnes françaises, mais comme elles sont beaucoup plus fortes, elles se distinguent clairement des consonnes basiques.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774527201/10-1_nh28b3.wav', isCompleted: true },
            { type: 'triple-char', char1: 'ㄱ', subtitle1: '/g/', charAudio1: SOUNDS.ㄱ, char2: 'ㅋ', subtitle2: '[kʰ]', charAudio2: SOUNDS.ㅋ, char3: 'ㄲ', subtitle3: '/k/', charAudio3: SOUNDS.ㄲ, text: "« 쌍기역 » est la variation de « ㄱ ». Ces trois lettres se prononcent toutes au même point d'articulation, mais pour « ㄲ », l'occlusion et l'explosion se réalisent beaucoup plus fortement que pour les autres lettres. Lorsque vous prononcez « ㄲ », faites attention à ne pas souffler d'air comme pour le son /kʰ/. De plus, le son de « ㄲ » a tendance à être plus court et plus aigu par rapport à « ㄱ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774527943/10-2_hcy8be.mp3', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '까치', ipa: '/k͈a.tʃʰi/', subtitle: 'Pie', audio: SOUNDS.까치_퀴즈, isCompleted: false },
            { type: 'triple-char', char1: 'ㄷ', subtitle1: '/d/', charAudio1: SOUNDS.ㄷ, char2: 'ㅌ', subtitle2: '[tʰ]', charAudio2: SOUNDS.ㅌ, char3: 'ㄸ', subtitle3: '/t/', charAudio3: SOUNDS.ㄸ, text: "Cette lettre est « 쌍디귿 », et c'est la variation de « ㄷ ». Ces trois lettres se prononcent également au même endroit, mais alors que « ㄷ » et « ㅌ » touchent légèrement les gencives supérieures, le son « ㄸ » est produit en appuyant fortement le bout de la langue contre les gencives puis en le relâchant. Lorsque vous prononcez « ㄸ », faites attention à ne pas souffler d'air comme pour /tʰ/, et prononcez-le de manière plus courte et plus aiguë que « ㄷ » et « ㅌ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774527953/10-3_rlrocz.mp3', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '또', ipa: '/t͈o/', subtitle: 'Encore', audio: SOUNDS.또, isCompleted: false },
            { type: 'triple-char', char1: 'ㅂ', subtitle1: '/b/', charAudio1: SOUNDS.ㅂ, char2: 'ㅍ', subtitle2: '[pʰ]', charAudio2: SOUNDS.ㅍ, char3: 'ㅃ', subtitle3: '/p/', charAudio3: SOUNDS.ㅃ, text: "« 쌍비읍 » est la variation de « ㅂ ». Alors que les sons « ㅂ » et « ㅍ » sont produits en fermant puis en ouvrant légèrement les lèvres, pour « ㅃ », on ferme fortement les lèvres en comprimant l'air avec force. Faites attention à ne pas souffler d'air consciemment comme pour /pʰ/, et prononcez-le de manière plus courte et plus aiguë que « ㅂ » et « ㅍ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774527876/10-4_ad7mw8.mp3', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '아빠', ipa: '/a.p͈a/', subtitle: 'Papa', audio: SOUNDS.아빠, isCompleted: false },
            { type: 'double-char', char1: 'ㅅ', subtitle1: '/s/', charAudio1: SOUNDS.ㅅ, char2: 'ㅆ', subtitle2: '/s͈/', charAudio2: SOUNDS.ㅆ, text: "Cette lettre est « 쌍시옷 ». Dans l'alphabet phonétique international, on transcrit généralement ces deux lettres par S. Cependant, alors que « 시옷 » expire l'air faiblement entre les gencives supérieures et le bout de la langue, « 쌍시옷 » expire l'air de manière beaucoup plus forte et courte. Souvent, ces deux sons ne se distinguent pas facilement lorsqu'ils sont isolés, et dans certains dialectes coréens, ils sont même prononcés comme des homophones.", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774527938/10-5_ypppri.mp3', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '쓰다', ipa: '/s͈ɯ.da/', subtitle: 'Écrire', audio: SOUNDS.쓰다, isCompleted: false },
            { type: 'triple-char', char1: 'ㅈ', subtitle1: '/dʒ/', charAudio1: SOUNDS.ㅈ, char2: 'ㅊ', subtitle2: '[tʃʰ]', charAudio2: SOUNDS.ㅊ, char3: 'ㅉ', subtitle3: '/dʒ/', charAudio3: SOUNDS.ㅉ, text: "« 쌍지읒 » est la variation de « ㅈ ». Comme pour les autres lettres, ces trois lettres se prononcent toutes au même point d'articulation, mais lorsqu'on prononce « ㅉ », on pousse la langue beaucoup plus fortement contre le palais dur, juste derrière les gencives. Faites attention à ne pas souffler d'air consciemment comme pour /ʦ/, et prononcez-le de manière plus courte et plus aiguë que « ㅈ » et « ㅊ ».", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774527948/10-6_juqb6k.mp3', isCompleted: true },
            { type: 'speech', text: 'Répétez après moi !', target: '짜다', ipa: '/t͈ʃa.da/', subtitle: 'Être salé', audio: SOUNDS.짜다, isCompleted: false },
            { type: 'reverse-quiz', question: 'Écoutez et cliquez sur le son correspondant au mot.', target: '싸다', answer: '싸다', options: [
                { audio: SOUNDS.사다, label: 'Audio 1', value: '사다' },
                { audio: SOUNDS.싸다, label: 'Audio 2', value: '싸다' }
            ], isCompleted: false },
            { type: 'reverse-quiz', question: 'Écoutez et cliquez sur le son correspondant au mot.', target: '자다', answer: '자다', options: [
                { audio: SOUNDS.자다, label: 'Audio 1', value: '자다' },
                { audio: SOUNDS.짜다, label: 'Audio 2', value: '짜다' }
            ], isCompleted: false },
            { type: 'reverse-quiz', question: 'Écoutez et cliquez sur le son correspondant au mot.', target: '빵', answer: '빵', options: [
                { audio: SOUNDS.빵, label: 'Audio 1', value: '빵' },
                { audio: SOUNDS.방, label: 'Audio 2', value: '방' }
            ], isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur la lettre correcte.', audio: SOUNDS.까치_퀴즈, options: ['가치', '까치'], answer: '까치', isCompleted: false },
            { type: 'quiz', question: 'Écoutez bien et cliquez sur la lettre correcte.', audio: SOUNDS.토_퀴즈, options: ['도', '토', '또'], answer: '토', isCompleted: false },
            { type: 'text-quiz', question: 'Sélectionnez le sens du mot.', targetWord: '쓰다', options: ['écrire', 'être salé'], answer: 'écrire', isCompleted: false },
            { type: 'outro', text: "Génial ! Vous avez enfin appris les 19 sons de consonnes, y compris les consonnes tendues. On peut presque dire que vous connaissez la majeure partie du hangeul maintenant, n'est-ce pas ? Dans le Chapitre 5, nous apprendrons les variations des voyelles. Alors, à la prochaine fois !", audio: 'https://res.cloudinary.com/de76i94ia/video/upload/v1774527961/10-7_hxogs5.wav', isCompleted: true }
        ];

        let currentPage = 0;
        let currentAudio = null;
        let interactionAudio = null;
        let backgroundAudioTimeout = null;
        let transitionSynth, correctSound, completionSound, wrongSound;
        
        let mediaRecorder;
        let audioChunks = [];
        let currentStream = null;
        let speechTries = 0;
        let recordingTimer = null;
        const MAX_TRIES = 2;
        const RECORDING_LIMIT = 6000; 

        const BASE_44_ORIGIN = "https://coreeno.base44.app";
        const CLOVA_API_FUNCTION_URL = BASE_44_ORIGIN + '/api/functions/naverClovaSpeech';

        window.onload = () => {
            Tone.Destination.volume.value = -8;
            transitionSynth = new Tone.Synth().toDestination();
            correctSound = new Tone.PolySynth().toDestination();
            wrongSound = new Tone.PolySynth().toDestination();
            completionSound = new Tone.PolySynth().toDestination();
            renderPage();
            window.addEventListener('blur', stopAllAudio);
            window.addEventListener('resize', adjustTextFit);
        };

        function stopAllAudio() {
            if (backgroundAudioTimeout) {
                clearTimeout(backgroundAudioTimeout);
                backgroundAudioTimeout = null;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (interactionAudio) {
                interactionAudio.pause();
                interactionAudio.currentTime = 0;
                interactionAudio = null;
            }
        }

        function playBackgroundAudio(url, delay = 0) {
            if (backgroundAudioTimeout) clearTimeout(backgroundAudioTimeout);
            if (!url) return; 
            backgroundAudioTimeout = setTimeout(() => {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
                currentAudio = new Audio(url);
                currentAudio.play().catch(e => {});
            }, delay);
        }

        function playInteractionAudio(url) {
            if (!url) return; 
            if (backgroundAudioTimeout) {
                clearTimeout(backgroundAudioTimeout);
                backgroundAudioTimeout = null;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (interactionAudio) {
                interactionAudio.pause();
                interactionAudio.currentTime = 0;
            }
            interactionAudio = new Audio(url);
            interactionAudio.play().catch(e => {});
        }

        function movePage(step) {
            const nextIdx = currentPage + step;
            if (nextIdx >= 0 && nextIdx < pages.length) {
                stopAllAudio();
                stopMicrophone(); 
                transitionSynth.triggerAttackRelease("C4", "8n");
                currentPage = nextIdx;
                renderPage();
            }
        }

        function renderPage() {
            const page = pages[currentPage];
            const container = document.getElementById('lesson-content');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');
            const progress = document.getElementById('progress');

            speechTries = 0; 
            container.classList.remove('active');
            
            setTimeout(() => {
                container.innerHTML = '';
                let html = '';

                nextBtn.disabled = (currentPage === pages.length - 1) || !page.isCompleted;
                prevBtn.disabled = (currentPage === 0 || currentPage === pages.length - 1);
                
                progress.innerText = `Page ${currentPage + 1} / ${pages.length}`;

                switch (page.type) {
                    case 'cover':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><h2 class="subtitle-main">${page.subtitle}</h2><h1 class="title-main">${page.title}</h1><button onclick="movePage(1)" class="mt-4 px-10 py-3 bg-indigo-600 text-white rounded-full text-lg font-bold hover:bg-indigo-700 transition-all shadow-lg shrink-0">${page.btnText}</button></div>`;
                        nextBtn.style.display = 'none'; prevBtn.style.display = 'none'; break;

                    case 'text':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><p class="desc-text font-medium mt-6">${page.text}</p></div>`;
                        nextBtn.style.display = 'flex'; prevBtn.style.display = 'flex'; break;

                    case 'double-char':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <div class="flex flex-row justify-center gap-2 sm:gap-6 w-full max-w-3xl mb-6 px-2 sm:px-0 shrink-0">

                                <div class="char-card shrink-0 mb-6 py-4 px-10 shadow-sm border-slate-200">

                                </div>
                                <div class="quiz-grid shrink-0" style="grid-template-columns: repeat(${page.options.length}, minmax(120px, 1fr));">
                                    ${page.options.map(opt => {

                                        return `<button class="quiz-option ${extraClass}" onclick="checkQuizAnswer(this, '${opt}', '${page.answer}')">${opt}</button>`;

                            </div>
                        `;
                        break;

                    case 'reverse-quiz':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900 mb-4">${page.question}</h2>
                                <div class="char-card shrink-0 mb-6 py-4 px-10 shadow-sm border-slate-200">
                                    <div class="hangeul-large text-indigo-600" style="font-size: clamp(3rem, 10vh, 6rem);">${page.target}</div>
                                </div>
                                <div class="flex flex-wrap justify-center shrink-0 gap-3 sm:gap-6 w-full max-w-xl mt-2">
                                    ${page.options.map((opt, i) => {
                                        let btnClass = (page.isCompleted && opt.value === page.answer) ? 'border-green-500 bg-green-50 text-green-600' : 'border-slate-200 text-slate-600';
                                        let showTrans = page.isCompleted ? `<p class="mt-1 sm:mt-2 font-bold text-slate-500">${opt.value}</p>` : `<p class="mt-1 sm:mt-2 font-bold text-slate-400 opacity-0 group-hover:opacity-50 transition-opacity">?</p>`;
                                        return `
                                        <div class="flex flex-col items-center group bg-white p-3 sm:p-4 rounded-2xl border-2 border-transparent hover:border-slate-100 transition-all flex-1 min-w-[100px] max-w-[150px]">
                                            <span class="text-[10px] sm:text-xs font-bold text-slate-400 mb-2 sm:mb-3 uppercase tracking-wider">${opt.label}</span>
                                            <button class="w-12 h-12 sm:w-16 sm:h-16 rounded-full border-2 bg-indigo-50 border-indigo-100 text-indigo-600 text-xl sm:text-2xl flex items-center justify-center hover:bg-indigo-100 hover:scale-105 transition-all shadow-sm mb-3 sm:mb-4"
                                                onclick="playInteractionAudio('${opt.audio}')">
                                                <i class="ph ph-speaker-high"></i>
                                            </button>
                                            <button class="px-3 py-1.5 sm:px-5 sm:py-2 border-2 rounded-xl font-bold text-xs sm:text-sm hover:bg-slate-50 transition-all select-opt-btn ${btnClass}"
                                                onclick="checkReverseQuizAnswer(this, '${opt.value}', '${page.answer}')">
                                                Choisir
                                            </button>
                                            <div class="transcription-container text-base sm:text-lg h-6 sm:h-8">${showTrans}</div>
                                        </div>`;
                                    }).join('')}
                                </div>
                                <p id="quiz-feedback" class="h-8 mt-2 sm:mt-4 text-lg font-bold shrink-0">${page.isCompleted ? '<span class="text-green-500">Excellent !</span>' : ''}</p>
                            </div>
                        `;
                        break;

                    case 'speech':
                        html = `
                            <div class="flex flex-col items-center w-full max-h-full min-h-0">
                                <h2 class="subtitle-main text-slate-900">${page.text}</h2>
                                <div class="char-card shrink-0 mb-4" onclick="playInteractionAudio('${page.audio}')">
                                    <div id="target-char" class="hangeul-large ${page.isCompleted ? 'text-green-500' : 'text-slate-300'}">${page.target}</div>
                                    ${page.ipa ? `<p class="ipa-text">${page.ipa}</p>` : ''}
                                    ${page.subtitle ? `<p class="text-sm text-slate-500 font-medium mt-1">${page.subtitle}</p>` : ''}
                                    <div class="mt-2 text-indigo-300"><i class="ph ph-speaker-high text-xl"></i></div>
                                </div>
                                <div id="speech-ui-container" class="flex flex-col items-center shrink-0 min-h-[140px]">
                                    ${page.isCompleted ? `
                                        <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                                        <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                                        ${page.score !== undefined ? `<div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2"><i class="ph ph-target text-indigo-500 text-xl"></i><span class="text-indigo-600 font-bold">Précision : ${page.score}%</span></div>` : ''}
                                    ` : `
                                        <button id="mic-btn" class="mic-btn" onclick="toggleRecording('${page.target}')"><i class="ph ph-microphone"></i></button>
                                        <p id="speech-status" class="text-slate-500 font-medium text-sm transition-all duration-300 mt-2">Cliquez sur le micro pour parler</p>
                                        <p id="speech-tries" class="text-[10px] text-slate-400 mt-1 uppercase">Essai: 0 / 2</p>
                                    `}
                                </div>
                            </div>
                        `;
                        break;

                    case 'outro':
                        html = `<div class="flex flex-col items-center w-full max-h-full min-h-0"><div class="text-5xl shrink-0 text-indigo-500 mb-4"><i class="ph ph-sparkle"></i></div><p class="desc-text font-bold text-center">${page.text}</p></div>`;
                        nextBtn.style.display = 'none';

                        completionSound.triggerAttackRelease(["E5", "G5", "C6", "E6"], "2n");
                        playBackgroundAudio(page.audio, 1000);
                        
                        setTimeout(() => {
                            window.parent.postMessage({ type: 'lesson_complete' }, '*');
                        }, 1000);
                        break;
                }

                container.innerHTML = html;
                
                requestAnimationFrame(() => adjustTextFit());
                container.classList.add('active');

                if (page.audio && page.type !== 'quiz' && page.type !== 'text-quiz' && page.type !== 'reverse-quiz' && page.type !== 'speech' && page.type !== 'outro') {
                    playBackgroundAudio(page.audio, 500);
                }
            }, 50);
        }

        function adjustTextFit() {
            const descTexts = document.querySelectorAll('.desc-text');
            descTexts.forEach(descText => {
                descText.style.fontSize = '';
                descText.style.lineHeight = '';
                
                let size = parseFloat(window.getComputedStyle(descText).fontSize);
                let attempts = 40; 
                const minSize = 13; 
                
                while (descText.scrollHeight > descText.clientHeight + 2 && size > minSize && attempts > 0) {
                    size -= 0.5;
                    descText.style.fontSize = size + 'px';
                    descText.style.lineHeight = '1.35';
                    attempts--;
                }
            });
        }

        function checkQuizAnswer(btn, selected, correct) {
            const page = pages[currentPage];
            if (page.isCompleted) return;
            const feedback = document.getElementById('quiz-feedback');
            if (selected === correct) {
                btn.classList.add('correct');
                feedback.innerHTML = '<span class="text-green-500">Excellent !</span>';
                correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                page.isCompleted = true;
                document.getElementById('next-btn').disabled = false;
            } else {
                btn.classList.add('wrong');
                feedback.innerHTML = '<span class="text-red-500">Réessayez !</span>';
                wrongSound.triggerAttackRelease(['G3', 'F3'], '8n');
                setTimeout(() => btn.classList.remove('wrong'), 1000);
            }
        }

        function checkReverseQuizAnswer(btn, selected, correct) {
            const page = pages[currentPage];
            if (page.isCompleted) return;
            const feedback = document.getElementById('quiz-feedback');
            
            document.querySelectorAll('.select-opt-btn').forEach(b => {
                b.classList.remove('border-red-500', 'bg-red-50', 'text-red-600');
            });

            if (selected === correct) {
                btn.classList.remove('border-slate-200', 'text-slate-600');
                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-600');
                feedback.innerHTML = '<span class="text-green-500">Excellent !</span>';
                correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                page.isCompleted = true;
                document.getElementById('next-btn').disabled = false;
                
                const containers = document.querySelectorAll('.transcription-container');
                page.options.forEach((opt, i) => {
                    containers[i].innerHTML = `<p class="mt-1 sm:mt-2 font-bold text-slate-500">${opt.value}</p>`;
                });
            } else {
                btn.classList.remove('border-slate-200', 'text-slate-600');
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-600');
                feedback.innerHTML = '<span class="text-red-500">Réessayez !</span>';
                wrongSound.triggerAttackRelease(['G3', 'F3'], '8n');
                
                setTimeout(() => {
                    if(!page.isCompleted) {
                        btn.classList.remove('border-red-500', 'bg-red-50', 'text-red-600');
                        btn.classList.add('border-slate-200', 'text-slate-600');
                    }
                }, 1000);
            }
        }

        async function toggleRecording(target) {
            const btn = document.getElementById('mic-btn');
            const status = document.getElementById('speech-status');
            if (!btn) return;

            if (btn.classList.contains('recording')) {
                stopRecordingManually();
            } else {
                if (speechTries >= MAX_TRIES) return;
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(currentStream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result.split(',')[1];
                            await verifySpeech(base64Audio, target);
                        };
                        stopMicrophone();
                    };
                    mediaRecorder.start();
                    btn.classList.add('recording');
                    if(status) status.innerText = "Écoute...";
                    if (recordingTimer) clearTimeout(recordingTimer);
                    recordingTimer = setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === "recording") stopRecordingManually();
                    }, RECORDING_LIMIT);
                } catch (err) { if(status) status.innerText = "Erreur micro."; }
            }
        }

        function stopRecordingManually() {
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            const btn = document.getElementById('mic-btn');
            if (btn) btn.classList.remove('recording');
            if (recordingTimer) clearTimeout(recordingTimer);
        }

        function stopMicrophone() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        function calculateSimilarity(ref, hyp) {
            if (!ref && !hyp) return 100;
            if (!ref || !hyp) return 0;
            ref = ref.trim();
            hyp = hyp.trim();
            if (ref === hyp) return 100;

            const matrix = [];
            for (let i = 0; i <= ref.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= hyp.length; j++) { matrix[0][j] = j; }

            for (let i = 1; i <= ref.length; i++) {
                for (let j = 1; j <= hyp.length; j++) {
                    if (ref.charAt(i - 1) === hyp.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, 
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                        );
                    }
                }
            }
            const distance = matrix[ref.length][hyp.length];
            const maxLength = Math.max(ref.length, hyp.length);
            return Math.max(0, Math.round(((maxLength - distance) / maxLength) * 100));
        }

        async function verifySpeech(audioBase64, referenceText) {
            const status = document.getElementById('speech-status');
            const triesDisplay = document.getElementById('speech-tries');
            const btn = document.getElementById('mic-btn');
            const charText = document.getElementById('target-char');
            const page = pages[currentPage];
            
            speechTries++;
            if(triesDisplay) triesDisplay.innerText = `Essai: ${speechTries} / ${MAX_TRIES}`;

            try {
                const response = await fetch(CLOVA_API_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audioBase64: audioBase64, languageCode: "Kor", referenceText: referenceText })
                });
                
                const result = await response.json();
                
                const recognizedText = result.text || result.recognizedText || result.value || "";
                
                let score = result.score || result.confidence;
                if (score === undefined || score === null) {
                    score = calculateSimilarity(referenceText, recognizedText);
                }
                
                page.score = score;

                if (speechTries === 1) {
                    if(charText) charText.className = "hangeul-large text-indigo-600";
                    playInteractionAudio(page.audio);
                    if (status) {
                        status.innerText = "Essayons encore une fois !";
                        status.className = "text-green-500 status-large transition-all duration-300 transform scale-110 mt-2";
                    }
                } else if (speechTries >= 2) {
                    correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                    page.isCompleted = true;
                    if(charText) charText.className = "hangeul-large text-green-500";
                    
                    const container = document.getElementById('speech-ui-container');
                    if(container) {
                        container.innerHTML = `
                            <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                            <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                            <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2">
                                <i class="ph ph-target text-indigo-500 text-xl"></i>
                                <span class="text-indigo-600 font-bold">Précision : ${page.score}%</span>
                            </div>
                        `;
                    }
                    document.getElementById('next-btn').disabled = false;
                }
            } catch (error) {
                if (speechTries >= MAX_TRIES) {
                    page.score = 0;
                    correctSound.triggerAttackRelease(['G5', 'C6'], '4n');
                    page.isCompleted = true;
                    if(charText) charText.className = "hangeul-large text-green-500";
                    
                    const container = document.getElementById('speech-ui-container');
                    if(container) {
                        container.innerHTML = `
                            <div class="mic-btn opacity-40 mb-2"><i class="ph ph-check"></i></div>
                            <p class="text-green-500 font-bold status-large mb-2">Très bien !</p>
                            <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2 flex items-center gap-2">
                                <i class="ph ph-target text-indigo-500 text-xl"></i>
                                <span class="text-indigo-600 font-bold">Précision : ${page.score}%</span>
                            </div>
                        `;
                    }
                    document.getElementById('next-btn').disabled = false;
                }
            }
        }
    </script>
